<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSIDIAN | The Cake Is the Room</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root { --bg:#0a0908; --gold:#c9a87c; --text:#f5f0eb; --muted:#8a8075; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; overflow:hidden; }
#canvas { position:fixed; inset:0; z-index:1; }
.overlay { position:relative; z-index:10; height:100%; display:flex; flex-direction:column; pointer-events:none; }
nav { pointer-events:auto; display:flex; justify-content:space-between; align-items:center; padding:1.5rem 4vw; background:linear-gradient(to bottom, rgba(10,9,8,0.8), transparent); }
.logo { font-family:'Playfair Display',serif; font-size:1.5rem; letter-spacing:0.35em; }
.logo span { color:var(--gold); }
nav a { color:var(--text); text-decoration:none; font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; margin-left:2rem; opacity:0.7; pointer-events:auto; }
nav a:hover { opacity:1; color:var(--gold); }
.hero { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:2rem; pointer-events:none; }
.hero h1 { font-family:'Playfair Display',serif; font-size:clamp(3rem, 8vw, 7rem); font-weight:400; line-height:0.9; letter-spacing:-0.02em; }
.hero h1 em { font-style:italic; color:#e8d5b5; }
.hero p { margin-top:1.5rem; letter-spacing:0.4em; text-transform:uppercase; color:var(--muted); font-size:0.85rem; }
.controls { position:absolute; bottom:2rem; left:50%; transform:translateX(-50%); display:flex; gap:1rem; pointer-events:auto; z-index:20; }
.btn { background:rgba(20,18,16,0.7); border:1px solid var(--gold); color:var(--gold); padding:0.7rem 1.4rem; font-size:0.7rem; letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; backdrop-filter:blur(4px); transition:all 0.3s; }
.btn:hover, .btn.active { background:var(--gold); color:var(--bg); }
.info-panel { position:absolute; right:4vw; top:50%; transform:translateY(-50%); max-width:280px; pointer-events:none; opacity:0; transition:opacity 0.4s; }
.info-panel.show { opacity:1; }
.info-panel h3 { font-family:'Playfair Display',serif; font-size:1.8rem; margin-bottom:0.5rem; }
.info-panel p { color:var(--muted); font-size:0.9rem; line-height:1.5; }
.hint { position:absolute; bottom:6rem; left:50%; transform:translateX(-50%); font-size:0.7rem; letter-spacing:0.3em; color:var(--muted); opacity:0.6; }
@media (max-width:768px) {
  .info-panel { position:relative; right:auto; top:auto; transform:none; max-width:none; text-align:center; margin-top:1rem; }
  nav a { display:none; }
}
</style>
</head>
<body>
<div id="canvas"></div>
<div class="overlay">
  <nav>
    <div class="logo">OBS<span>IDIAN</span></div>
    <div>
      <a href="#" onclick="focusCake(0);return false;">Noir</a>
      <a href="#" onclick="focusCake(1);return false;">Molten</a>
      <a href="#" onclick="focusCake(2);return false;">Veil</a>
    </div>
  </nav>
  <div class="hero">
    <h1>The cake<br>is the <em>room</em></h1>
    <p>Too real · Interactive 3D · 2026</p>
  </div>
  <div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM · CLICK CAKES</div>
  <div class="controls">
    <button class="btn active" onclick="setMode('orbit')">Orbit</button>
    <button class="btn" onclick="setMode('inspect')">Inspect</button>
  </div>
  <div class="info-panel" id="info">
    <h3 id="info-title">Noir Sphere</h3>
    <p id="info-desc">Gold spheres suspended in black glaze. Silent luxury.</p>
  </div>
</div>

<script>
const cakes = [
  { name: "Noir Sphere", desc: "Gold spheres suspended in black glaze. Silent luxury.", color: 0x1a1510 },
  { name: "Molten Drip", desc: "Dark chocolate that moves. Heat and stillness.", color: 0x2a1a12 },
  { name: "Pomegranate Veil", desc: "Black velvet, crushed ruby, living color.", color: 0x1f0f12 }
];

let scene, camera, renderer, cakesGroup, raycaster, mouse;
let currentMode = 'orbit';
let targetCake = 0;
let isDragging = false, prevMouse = {x:0,y:0};
let rotation = {x:0.2, y:0};

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0908);
  scene.fog = new THREE.Fog(0x0a0908, 8, 18);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 8);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('canvas').appendChild(renderer.domElement);

  const ambient = new THREE.AmbientLight(0x404040, 0.6);
  scene.add(ambient);
  const key = new THREE.DirectionalLight(0xfff5e0, 1.2);
  key.position.set(3, 6, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xc9a87c, 0.8);
  rim.position.set(-4, 2, -2);
  scene.add(rim);
  const fill = new THREE.PointLight(0xffaa66, 0.4, 10);
  fill.position.set(0, 1, 3);
  scene.add(fill);

  const floorGeo = new THREE.CircleGeometry(12, 64);
  const floorMat = new THREE.MeshStandardMaterial({ color:0x11100e, roughness:0.8, metalness:0.1 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -1.2;
  scene.add(floor);

  cakesGroup = new THREE.Group();
  scene.add(cakesGroup);

  cakes.forEach((c, i) => {
    const group = new THREE.Group();
    const pedGeo = new THREE.CylinderGeometry(0.6, 0.7, 0.15, 32);
    const pedMat = new THREE.MeshStandardMaterial({ color:0x1a1816, metalness:0.3, roughness:0.4 });
    const ped = new THREE.Mesh(pedGeo, pedMat);
    ped.position.y = -0.9;
    group.add(ped);

    const cakeGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.7, 48);
    const cakeMat = new THREE.MeshStandardMaterial({ color: c.color, roughness: 0.3, metalness: 0.4 });
    const cake = new THREE.Mesh(cakeGeo, cakeMat);
    cake.position.y = -0.4;
    cake.userData = { index: i, type: 'cake' };
    group.add(cake);

    const topGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const topMat = new THREE.MeshStandardMaterial({ color:0xc9a87c, metalness:0.8, roughness:0.2 });
    for (let j=0; j<5; j++) {
      const ball = new THREE.Mesh(topGeo, topMat);
      const ang = (j/5)*Math.PI*2;
      ball.position.set(Math.cos(ang)*0.25, 0.05, Math.sin(ang)*0.25);
      group.add(ball);
    }

    group.position.x = (i - 1) * 2.2;
    group.userData = { index: i };
    cakesGroup.add(group);
  });

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  renderer.domElement.addEventListener('pointerdown', onDown);
  renderer.domElement.addEventListener('pointermove', onMove);
  renderer.domElement.addEventListener('pointerup', onUp);
  renderer.domElement.addEventListener('wheel', onWheel, { passive:false });
  window.addEventListener('resize', onResize);

  animate();
  updateInfo(0);
}

function onDown(e) { isDragging = true; prevMouse.x = e.clientX; prevMouse.y = e.clientY; }
function onMove(e) {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  rotation.y += dx * 0.005;
  rotation.x += dy * 0.003;
  rotation.x = Math.max(-0.5, Math.min(0.8, rotation.x));
  prevMouse.x = e.clientX;
  prevMouse.y = e.clientY;
}
function onUp() { isDragging = false; }
function onWheel(e) {
  e.preventDefault();
  camera.position.z = Math.max(4, Math.min(12, camera.position.z + e.deltaY * 0.01));
}
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
function focusCake(i) {
  targetCake = i;
  updateInfo(i);
}
function setMode(m) {
  currentMode = m;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}
function updateInfo(i) {
  document.getElementById('info-title').textContent = cakes[i].name;
  document.getElementById('info-desc').textContent = cakes[i].desc;
  document.getElementById('info').classList.add('show');
}
function animate() {
  requestAnimationFrame(animate);
  cakesGroup.rotation.y = rotation.y;
  cakesGroup.rotation.x = rotation.x;
  if (!isDragging && currentMode === 'orbit') rotation.y += 0.002;
  cakesGroup.children.forEach((g, i) => {
    const scale = i === targetCake ? 1.05 : 1;
    g.scale.lerp(new THREE.Vector3(scale, scale, scale), 0.05);
  });
  renderer.render(scene, camera);
}
init();
</script>
</body>
</html>
